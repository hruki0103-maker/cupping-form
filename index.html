<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CUPPING LOG — 焙煎QCカッピング記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    デザインの方向性（読み返す用メモ）：
    焙煎機の操作パネルやCropsterのような「計測器」を参照にした、
    暗いグラファイト地＋琥珀（amber）1色のみのアクセント。
    丸みはほぼ排除し、罫線（hairline）と等幅フォントで
    「スペックシートに数値を記録している」感覚を作る。

    2026-07-19 改修：
    画面の軸を「サンプル別タブ」から「時系列ステップ別」へ変更。
    準備→フレグランス→アロマ→ホット→ウォーム→コールド→まとめ の7ステップ。
    ヘッダーにストップウォッチ（目安時刻で音通知＋Wake Lock）と
    サンプルジャンプバーを常時固定。
  */
  :root {
    color-scheme: dark;
    --bg: #14120f;
    --panel: #1a1815;
    --panel-raised: #201d19;
    --line: #322d26;
    --line-strong: #4a443a;
    --ink: #ece6da;
    --ink-dim: #a39b8c;
    --ink-faint: #6b6459;
    --amber: #dd8339;
    --amber-bright: #ffb066;
    --amber-dim: #6b4423;
    --amber-glow: rgba(221, 131, 57, 0.35);
    --danger: #c1573c;
    --danger-dim: #3a2620;

    --font-display: 'Space Grotesk', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    padding-bottom: 130px; /* 下部固定ナビのぶん空ける */
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

  /* ==== タイトル（固定しない・最小限） ==== */
  .topbar {
    padding: 12px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    max-width: 640px;
    margin: 0 auto;
  }
  .topbar .eyebrow-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
  }
  .topbar .sub {
    font-size: 11px;
    color: var(--ink-faint);
  }

  /* ==== 固定ヘッダー：ストップウォッチ＋ステップ＋サンプルジャンプ ==== */
  .sticky-head {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 640px;
    margin: 0 auto;
    padding: 10px 16px 8px;
  }
  .timer-display {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 600;
    color: var(--amber);
    text-shadow: 0 0 16px var(--amber-glow);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .timer-hint {
    font-size: 11px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
  }
  .timer-display.alert, .timer-hint.alert {
    color: var(--amber-bright);
    animation: pulse 0.8s ease infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .timer-btns { display: flex; gap: 8px; }
  .tbtn {
    padding: 8px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .tbtn.primary { background: var(--amber); border-color: var(--amber); color: #14120f; font-weight: 600; }

  .step-nav {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    gap: 4px;
    max-width: 640px;
    margin: 0 auto;
    padding: 2px 12px 8px;
  }
  .step-chip {
    flex: 0 0 auto;
    padding: 6px 11px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    text-align: left;
  }
  .step-chip.active { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
  .step-chip .t { display: block; font-size: 9px; color: var(--ink-faint); }
  .step-chip.active .t { color: var(--amber); opacity: 0.7; }

  .sample-bar {
    display: flex;
    gap: 6px;
    max-width: 640px;
    margin: 0 auto;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--line);
    overflow-x: auto;
  }
  .sample-bar:empty { display: none; }
  .sample-jump {
    flex: 1 0 auto;
    min-width: 44px;
    padding: 6px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
  }
  .sample-jump:active { border-color: var(--amber); color: var(--amber); }

  /* ==== ステップ見出し ==== */
  .step-title {
    margin: 18px 0 4px;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
  }
  .step-title .num { font-family: var(--font-mono); font-size: 12px; color: var(--amber); margin-right: 8px; }
  .step-sub { font-size: 12px; color: var(--ink-faint); margin: 0 0 4px; }

  /* ==== 汎用パネル ==== */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 20px;
    margin-top: 14px;
  }
  .panel .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--ink);
  }
  .panel .hint {
    font-size: 12px;
    color: var(--ink-faint);
    margin: -8px 0 14px;
  }
  .export-hint { font-size: 12px; color: var(--ink-faint); margin: 8px 0 0; }

  /* ==== セッション情報（準備ステップ） ==== */
  .session-row { display: flex; gap: 20px; }
  .session-row > div { flex: 1; }
  .session-row label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .session-row input[type=date],
  .session-row input[type=text] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    border-radius: 0;
    padding: 6px 2px 8px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
  }
  .session-row input:focus { border-bottom-color: var(--amber); outline: none; }

  .sample-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .sample-row .sid { font-family: var(--font-mono); font-size: 14px; }
  .sample-row .remove {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--danger);
    background: none;
    border: none;
    cursor: pointer;
  }
  .add-sample-btn {
    margin-top: 12px;
    padding: 9px 14px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
  }
  .milestone-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-dim);
  }
  .milestone-row input {
    width: 64px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink);
    text-align: right;
    padding: 4px;
  }
  .milestone-row input:focus { border-bottom-color: var(--amber); outline: none; }
  .milestone-row .unit { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-left: 6px; }

  /* ==== サンプルカード（縦積み／アコーディオン） ==== */
  .sample-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    margin-top: 10px;
    scroll-margin-top: 165px; /* ジャンプ時に固定ヘッダーに隠れないように */
  }
  .sample-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }
  .sample-card-head.clickable { cursor: pointer; }
  .sample-card-head .sid { font-family: var(--font-mono); font-size: 15px; color: var(--ink); }
  .sample-card-head .sid .caret { color: var(--ink-faint); margin-right: 8px; }
  .sample-card-head .score {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .sample-card-body {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
  }
  .sample-card.collapsed .sample-card-body { display: none; }
  .sample-card.collapsed .sample-card-head { opacity: 0.7; }

  .card-section { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }
  .card-section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 8px;
  }

  /* ==== CVAスライダー ==== */
  .slider-row { margin-bottom: 16px; }
  .slider-row:last-child { margin-bottom: 4px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .slider-label .val {
    font-family: var(--font-mono);
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .info-desc {
    font-size: 12px;
    color: var(--ink-faint);
    margin: -2px 0 10px;
    padding-left: 8px;
    border-left: 2px solid var(--line-strong);
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 24px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px;
    background-image: repeating-linear-gradient(
      to right,
      var(--line-strong) 0, var(--line-strong) 1px,
      transparent 1px, transparent 12.5%
    );
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 3px;
    height: 18px;
    margin-top: -8px;
    background: var(--amber);
    border-radius: 0;
    box-shadow: 0 0 6px var(--amber-glow);
  }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line-strong); }
  input[type=range]::-moz-range-thumb {
    width: 3px; height: 18px;
    background: var(--amber);
    border: none; border-radius: 0;
    box-shadow: 0 0 6px var(--amber-glow);
  }

  /* ==== 欠陥チェック ==== */
  .defect-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .defect-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .defect-chip.checked { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }
  .defect-chip input { accent-color: var(--danger); width: 14px; height: 14px; }
  .defect-info-btn {
    border: none;
    background: none;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }
  .defect-chip.checked .defect-info-btn { color: var(--danger); }
  .defect-info-btn:hover, .defect-info-btn:focus-visible { color: var(--amber); }
  .defect-info { margin-top: 12px; }
  .defect-info[hidden] { display: none; }

  /* ==== 語彙チップ・メモ ==== */
  .word-group { margin-bottom: 10px; }
  .word-group:last-child { margin-bottom: 0; }
  .word-group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .word-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-chip {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-dim);
    font-size: 12px;
    cursor: pointer;
  }
  .word-chip:hover, .word-chip:focus-visible { border-color: var(--amber); color: var(--amber); }
  .word-chip.selected { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
  .note-input-row { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
  .note-input-row input[type=text] {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    padding: 8px 2px;
    font-size: 14px;
    color: var(--ink);
  }
  .note-input-row input:focus { border-bottom-color: var(--amber); outline: none; }
  .note-add-btn {
    padding: 8px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .note-list { list-style: none; padding: 0; margin: 12px 0 0; }
  .note-list li {
    font-size: 13px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
  }
  .note-list .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--amber);
    margin-right: 8px;
  }
  .note-list .del {
    float: right;
    font-family: var(--font-mono);
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 11px;
  }

  textarea.free-note {
    width: 100%;
    min-height: 64px;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    padding: 10px;
    font-size: 14px;
    font-family: var(--font-body);
    color: var(--ink);
    resize: vertical;
  }
  textarea.free-note:focus { border-color: var(--amber); outline: none; }

  /* ==== 比較表 ==== */
  table.compare { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.compare th {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: left;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  table.compare td {
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
  }
  table.compare td:first-child { font-family: var(--font-mono); color: var(--ink); }
  table.compare td.score {
    font-family: var(--font-mono);
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  /* ==== 答え合わせ ==== */
  .reveal-row {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
  }
  .reveal-row span { font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); }
  .reveal-row input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    padding: 8px 2px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    width: 100%;
  }
  .reveal-row input:focus { border-bottom-color: var(--amber); outline: none; }
  .reveal-head {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }

  /* ==== 書き出し ==== */
  .export-area {
    width: 100%;
    min-height: 160px;
    background: var(--panel-raised);
    color: var(--ink-dim);
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 14px;
    white-space: pre;
    line-height: 1.6;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .btn {
    padding: 10px 18px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #14120f; font-weight: 600; }
  .btn.warn { color: var(--danger); border-color: var(--danger); }

  footer {
    text-align: center;
    font-family: var(--font-mono);
    color: var(--ink-faint);
    font-size: 11px;
    margin-top: 28px;
    letter-spacing: 0.02em;
  }

  /* ==== 下部固定ナビ：前へ／次へ ==== */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    z-index: 20;
  }
  .bottom-nav-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bottom-nav button {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bottom-nav button.next { background: var(--amber); border-color: var(--amber); color: #14120f; font-weight: 600; }
  .bottom-nav button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <span class="eyebrow-title">Cupping Log</span>
  <span class="sub">焙煎QCカッピング記録</span>
</div>

<!-- 固定ヘッダー：ストップウォッチ／ステップ／サンプルジャンプ -->
<div class="sticky-head">
  <div class="timer-row">
    <div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-hint" id="timerHint"></div>
    </div>
    <div class="timer-btns">
      <button class="tbtn primary" id="timerToggle">START</button>
      <button class="tbtn" id="timerReset">RESET</button>
    </div>
  </div>
  <div class="step-nav" id="stepNav"></div>
  <div class="sample-bar" id="sampleBar"></div>
</div>

<div class="wrap" id="content"></div>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button id="prevStep">◀</button>
    <button class="next" id="nextStep">▶</button>
  </div>
</div>

<script>
/*
  設計メモ(読み返す用):
  - state ひとつにすべてのデータを持たせて、変更のたびに localStorage に保存する
    → ページを閉じても、リロードしても、カッピング中のデータが消えない
  - 保存キーは旧版と同じ "cupping_form_state_v1"。旧データを読み込んだら
    migrate() が足りないフィールド（currentStep・timer・milestones）を補完する
    → 改修前のカッピング途中データもそのまま引き継げる
  - スコアはサンプルごとに1つ（CVA方式）。ホットで仮置き→ウォーム・コールドで
    同じスライダーを調整して確定する。温度帯ごとの気づきは語彙チップ・メモで残す
*/

const STEPS = [
  { key: "prep",  name: "準備",        time: "注湯前",    sub: "セッション情報・サンプル・目安時刻の設定" },

  { key: "warm",  name: "ウォーム",    time: "〜20分",    sub: "2巡目：スコアを調整＋気づき", items: TASTE_KEYS, stage: "温かい", layout: "accordion" },
  { key: "cold",  name: "コールド",    time: "〜30分",    sub: "最終確認：スコア確定・欠陥の確定", items: TASTE_KEYS, stage: "冷めた", layout: "accordion" },
  { key: "wrap",  name: "まとめ",      time: "終了後",    sub: "総合メモ・比較・答え合わせ・書き出し" },
];

const STORAGE_KEY = "cupping_form_state_v1";

function defaultState() {
  return {
    sessionDate: new Date().toISOString().slice(0, 10),
    sessionNote: "",
    sampleOrder: ["A", "B", "C", "D", "E", "Ref"],
    currentSample: "A",
    currentStep: 0,
    samples: {}, // { id: { scores:{}, defects:[], notes:[{stage,text}], freeNote:'' } }
    reveal: {},  // { id: { batch:'' } }　※DT%・煎り止めBTはここには持たず、バッチ名から焙煎ログ側で突き合わせる
    milestones: { break: 4, hot: 10, warm: 20, cold: 30 }, // 分
    timer: { running: false, startedAt: null, elapsed: 0, notified: [] },
  };
}

function emptySample() {
  const scores = {};
  CVA_ITEMS.forEach(i => scores[i.key] = 5);
  return { scores, defects: [], notes: [], freeNote: "" };
}

// 旧版のデータに足りないフィールドを補完する（データ互換の要）
function migrate(parsed) {
  const s = Object.assign(defaultState(), parsed);
  if (!s.milestones) s.milestones = defaultState().milestones;
  if (!s.timer) s.timer = defaultState().timer;
  if (!Array.isArray(s.timer.notified)) s.timer.notified = [];
  s.currentStep = Math.min(Math.max(0, Number(s.currentStep) || 0), STEPS.length - 1);
  if (!Array.isArray(s.sampleOrder)) s.sampleOrder = defaultState().sampleOrder;
  s.sampleOrder.forEach(id => {
    if (!s.samples[id]) s.samples[id] = emptySample();
    if (!s.reveal[id]) s.reveal[id] = { batch: "" };
  });
  if (!s.sampleOrder.includes(s.currentSample)) s.currentSample = s.sampleOrder[0] || null;
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return migrate(JSON.parse(raw));
  } catch (e) {
    return defaultState();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function cvaScore(scores) {
  const sum = CVA_ITEMS.reduce((a, i) => a + Number(scores[i.key] || 0), 0);
  const raw = 0.65625 * sum + 52.75;
  return Math.round(raw * 4) / 4; // 0.25刻みに丸める
}

// Markdown書き出し（形式は旧版と同一。焙煎ログとの突き合わせを崩さない）
function buildExportText(s) {
  const lines = [];
  lines.push(`## カッピング記録 ${s.sessionDate}${s.sessionNote ? "　" + s.sessionNote : ""}`);
  lines.push("");
  lines.push("| サンプル | バッチ名 | CVAスコア | 欠陥 |");
  lines.push("|---|---|---|---|");
  s.sampleOrder.forEach(id => {
    const sm = s.samples[id];
    const r = s.reveal[id] || { batch: "" };
    const defectLabels = sm.defects.map(k => DEFECTS.find(d => d.key === k).label).join("、") || "なし";
    lines.push(`| ${id} | ${r.batch} | ${cvaScore(sm.scores)} | ${defectLabels} |`);
  });
  lines.push("");
  s.sampleOrder.forEach(id => {
    const sm = s.samples[id];
    if (sm.notes.length === 0 && !sm.freeNote) return;
    lines.push(`### サンプル ${id}`);
    sm.notes.forEach(n => lines.push(`- [${n.stage}] ${n.text}`));
    if (sm.freeNote) lines.push(`- [総合] ${sm.freeNote}`);
    lines.push("");
  });
  return lines.join("\n");
}

function obsidianFilepath(s) {
  return `02_Project/焙煎/log/${s.sessionDate}-カッピング.md`;
}

let state = load();

// アコーディオンでいま開いているサンプル（画面の都合なので保存しない）
let openCards = new Set(state.sampleOrder.length ? [state.sampleOrder[0]] : []);

function ensureSample(id) {
  if (!state.samples[id]) state.samples[id] = emptySample();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---- ストップウォッチ ---- */

let audioCtx = null;
let wakeLock = null;
let alertUntil = 0;
let alertLabel = "";

// 音を鳴らすには一度ユーザー操作（STARTタップ）が必要。そこでAudioContextを起こす
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* 非対応なら音なしで続行 */ }
}

function beep() {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime;
  [0, 0.28, 0.56].forEach(off => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, t0 + off);
    gain.gain.exponentialRampToValueAtTime(0.35, t0 + off + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.2);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + off);
    osc.stop(t0 + off + 0.22);
  });
}

// タイマー作動中は画面を自動消灯させない（消灯すると音が鳴らせないため）
async function acquireWakeLock() {
  try {
    if (!("wakeLock" in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { /* 非対応・画面非表示のときは黙って諦める */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.timer.running) acquireWakeLock();
});

function elapsedSec() {
  const t = state.timer;
  return Math.floor(t.elapsed + (t.running ? (Date.now() - t.startedAt) / 1000 : 0));
}

function fmt(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function milestoneList() {
  return MILESTONE_DEFS
    .map(m => ({ key: m.key, label: m.label, at: (Number(state.milestones[m.key]) || m.defaultMin) * 60 }))
    .sort((a, b) => a.at - b.at);
}

function fireAlert(label) {
  alertLabel = label;
  alertUntil = Date.now() + 6000;
  beep();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // iPhoneは非対応（音と表示で代替）
}

function tick() {
  const sec = elapsedSec();
  document.getElementById("timerDisplay").textContent = fmt(sec);

  // 目安時刻を通過したら1回だけ通知する
  if (state.timer.running) {
    milestoneList().forEach(m => {
      if (sec >= m.at && !state.timer.notified.includes(m.key)) {
        state.timer.notified.push(m.key);
        save();
        fireAlert(`${fmt(m.at)} ${m.label}`);
      }
    });
  }

  const hintEl = document.getElementById("timerHint");
  const dispEl = document.getElementById("timerDisplay");
  if (Date.now() < alertUntil) {
    hintEl.textContent = `⏰ ${alertLabel}`;
    hintEl.classList.add("alert");
    dispEl.classList.add("alert");
  } else {
    hintEl.classList.remove("alert");
    dispEl.classList.remove("alert");
    const next = milestoneList().find(m => m.at > sec);
    hintEl.textContent = next ? `次の目安 → ${fmt(next.at)} ${next.label}` : "全ての目安時刻を通過";
  }
}

function updateTimerButtons() {
  document.getElementById("timerToggle").textContent = state.timer.running ? "PAUSE" : "START";
}

document.getElementById("timerToggle").onclick = () => {
  ensureAudio();
  const t = state.timer;
  if (t.running) {
    t.elapsed += (Date.now() - t.startedAt) / 1000;
    t.running = false;
    t.startedAt = null;
    releaseWakeLock();
  } else {
    t.running = true;
    t.startedAt = Date.now();
    acquireWakeLock();
  }
  save();
  updateTimerButtons();
  tick();
};

document.getElementById("timerReset").onclick = () => {
  state.timer = { running: false, startedAt: null, elapsed: 0, notified: [] };
  alertUntil = 0;
  releaseWakeLock();
  save();
  updateTimerButtons();
  tick();
};

/* ---- ヘッダー（ステップナビ・サンプルジャンプ） ---- */

function setStep(i) {
  state.currentStep = i;
  openCards = new Set(state.sampleOrder.length ? [state.sampleOrder[0]] : []);
  save();
  renderAll();
  window.scrollTo(0, 0);
}

function renderStepNav() {
  const nav = document.getElementById("stepNav");
  nav.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "step-chip" + (i === state.currentStep ? " active" : "");
    b.innerHTML = `${i + 1}.${s.name}<span class="t">${s.time}</span>`;
    b.onclick = () => setStep(i);
    nav.appendChild(b);
  });
  const active = nav.querySelector(".active");
  if (active && active.scrollIntoView) active.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderSampleBar() {
  const bar = document.getElementById("sampleBar");
  bar.innerHTML = "";
  if (STEPS[state.currentStep].key === "prep") return; // 準備ステップでは不要
  state.sampleOrder.forEach(id => {
    const b = document.createElement("button");
    b.className = "sample-jump";
    b.textContent = id;
    b.onclick = () => {
      openCards.add(id); // アコーディオンなら開いてから移動
      renderContent();
      const card = document.getElementById("card-" + id);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    bar.appendChild(b);
  });
}

/* ---- ステップ本体の描画 ---- */

function stepHeader(step) {
  const div = document.createElement("div");
  const i = STEPS.indexOf(step);
  div.innerHTML = `
    <h2 class="step-title"><span class="num">STEP ${i + 1} / ${step.time}</span>${step.name}</h2>
    <p class="step-sub">${step.sub}</p>`;
  return div;
}

function renderContent() {
  const step = STEPS[state.currentStep];
  if (step.key === "prep") renderPrep(step);
  else if (step.key === "wrap") renderWrap(step);
  else renderScoreStep(step);
}

/* 準備ステップ：セッション情報・サンプル管理・目安時刻 */
function renderPrep(step) {
  const c = document.getElementById("content");
  c.innerHTML = "";
  c.appendChild(stepHeader(step));

  // セッション情報
  const session = document.createElement("div");
  session.className = "panel";
  session.innerHTML = `
    <div class="eyebrow">Session</div>
    <div class="session-row">
      <div>
        <label>Date</label>
        <input type="date" id="sessionDate">
      </div>
      <div>
        <label>対象バッチ範囲・メモ</label>
        <input type="text" id="sessionNote" placeholder="例：01〜05、リファレンス豆あり">
      </div>
    </div>`;
  c.appendChild(session);
  const dateInput = session.querySelector("#sessionDate");
  const noteInput = session.querySelector("#sessionNote");
  dateInput.value = state.sessionDate;
  noteInput.value = state.sessionNote;
  dateInput.onchange = e => { state.sessionDate = e.target.value; save(); };
  noteInput.oninput = e => { state.sessionNote = e.target.value; save(); };

  // サンプル管理
  const samplesPanel = document.createElement("div");
  samplesPanel.className = "panel";
  samplesPanel.innerHTML = `<div class="eyebrow">Samples</div><h2>サンプル一覧</h2><div id="sampleRows"></div>`;
  const rows = samplesPanel.querySelector("#sampleRows");
  state.sampleOrder.forEach(id => {
    ensureSample(id);
    const row = document.createElement("div");
    row.className = "sample-row";
    row.innerHTML = `<span class="sid">サンプル ${escapeHtml(id)}</span><button class="remove">削除</button>`;
    row.querySelector(".remove").onclick = () => {
      if (!confirm(`サンプル ${id} のデータを削除します。よろしいですか？`)) return;
      state.sampleOrder = state.sampleOrder.filter(x => x !== id);
      delete state.samples[id];
      delete state.reveal[id];
      openCards.delete(id);
      save();
      renderAll();
    };
    rows.appendChild(row);
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-sample-btn";
  addBtn.textContent = "＋ サンプルを追加";
  addBtn.onclick = () => {
    const label = prompt("新しいサンプルの記号・名前を入力してください（例：F）");
    if (!label) return;
    if (!state.sampleOrder.includes(label)) state.sampleOrder.push(label);
    ensureSample(label);
    save();
    renderAll();
  };
  samplesPanel.appendChild(addBtn);
  c.appendChild(samplesPanel);

  // 目安時刻
  const msPanel = document.createElement("div");
  msPanel.className = "panel";
  msPanel.innerHTML = `
    <div class="eyebrow">Timer</div>
    <h2>目安時刻（通知タイミング）</h2>
    <p class="hint">注湯と同時にSTART。目安時刻になると音でお知らせします</p>`;
  MILESTONE_DEFS.forEach(m => {
    const row = document.createElement("div");
    row.className = "milestone-row";
    row.innerHTML = `<span>${m.label}</span><span><input type="number" min="1" max="120" value="${Number(state.milestones[m.key]) || m.defaultMin}"><span class="unit">分</span></span>`;
    row.querySelector("input").onchange = e => {
      const v = Number(e.target.value);
      if (v > 0) { state.milestones[m.key] = v; save(); tick(); }
    };
    msPanel.appendChild(row);
  });
  c.appendChild(msPanel);
}

/* 採点ステップ（フレグランス／アロマ／ホット／ウォーム／コールド） */
function renderScoreStep(step) {
  const c = document.getElementById("content");
  c.innerHTML = "";
  c.appendChild(stepHeader(step));
  state.sampleOrder.forEach(id => {
    ensureSample(id);
    c.appendChild(buildSampleCard(id, step));
  });
}

function replaceCard(id, step) {
  const old = document.getElementById("card-" + id);
  if (old) old.replaceWith(buildSampleCard(id, step));
}

function buildSampleCard(id, step) {
  const isAccordion = step.layout === "accordion";
  const collapsed = isAccordion && !openCards.has(id);
  const sample = state.samples[id];

  const card = document.createElement("div");
  card.className = "sample-card" + (collapsed ? " collapsed" : "");
  card.id = "card-" + id;

  // ヘッダー行（アコーディオンならタップで開閉）
  const head = document.createElement("div");
  head.className = "sample-card-head" + (isAccordion ? " clickable" : "");
  head.innerHTML = `
    <span class="sid">${isAccordion ? `<span class="caret">${collapsed ? "▸" : "▾"}</span>` : ""}サンプル ${escapeHtml(id)}</span>
    <span class="score">${cvaScore(sample.scores)}</span>`;
  if (isAccordion) {
    head.onclick = () => {
      if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
      replaceCard(id, step);
    };
  }
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "sample-card-body";

  // スライダー（このステップで扱う項目だけ）
  step.items.forEach(key => {
    const item = CVA_ITEMS.find(i => i.key === key);
    const row = document.createElement("div");
    row.className = "slider-row";
    const val = sample.scores[key];
    // 縦積みステップ（項目1つ）は説明つき、アコーディオン（6項目）はコンパクトに
    row.innerHTML = `
      <div class="slider-label"><span>${item.label}</span><span class="val">${val}</span></div>
      ${step.layout === "stack" ? `<p class="info-desc">${item.desc}</p>` : ""}
      <input type="range" min="1" max="9" step="1" value="${val}">`;
    const input = row.querySelector("input");
    input.oninput = () => {
      sample.scores[key] = Number(input.value);
      row.querySelector(".val").textContent = input.value;
      head.querySelector(".score").textContent = cvaScore(sample.scores);
      save();
    };
    body.appendChild(row);
  });

  // 温度帯ステップだけ：欠陥チェック＋語彙チップ＋メモ
  if (step.stage) {
    body.appendChild(buildDefectSection(id, step));
    body.appendChild(buildNoteSection(id, step));
  }

  card.appendChild(body);
  return card;
}

function buildDefectSection(id, step) {
  const sample = state.samples[id];
  const section = document.createElement("div");
  section.className = "card-section";
  section.innerHTML = `<div class="card-section-label">欠陥チェック（3つの温度帯で共通）</div>`;
  const grid = document.createElement("div");
  grid.className = "defect-grid";
  const info = document.createElement("p");
  info.className = "info-desc defect-info";
  info.hidden = true;

  DEFECTS.forEach(d => {
    const checked = sample.defects.includes(d.key);
    const chip = document.createElement("label");
    chip.className = "defect-chip" + (checked ? " checked" : "");
    chip.innerHTML = `<input type="checkbox" ${checked ? "checked" : ""}> ${d.label}<button type="button" class="defect-info-btn" aria-label="${d.label}の説明">[?]</button>`;
    chip.querySelector("input").onchange = (e) => {
      const set = new Set(sample.defects);
      if (e.target.checked) set.add(d.key); else set.delete(d.key);
      sample.defects = Array.from(set);
      save();
      replaceCard(id, step);
    };
    chip.querySelector(".defect-info-btn").onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const alreadyOpenForThis = !info.hidden && info.dataset.key === d.key;
      if (alreadyOpenForThis) {
        info.hidden = true;
      } else {
        info.textContent = `${d.label}：${d.desc}`;
        info.dataset.key = d.key;
        info.hidden = false;
      }
    };
    grid.appendChild(chip);
  });
  section.appendChild(grid);
  section.appendChild(info);
  return section;
}

function buildNoteSection(id, step) {
  const sample = state.samples[id];
  const stage = step.stage;
  const section = document.createElement("div");
  section.className = "card-section";
  section.innerHTML = `<div class="card-section-label">気づき（${stage}）— タップで追加</div>`;

  // 語彙チップ（この温度帯で選択済みのものをハイライト）
  NOTE_WORDS.forEach(g => {
    const groupDiv = document.createElement("div");
    groupDiv.className = "word-group";
    groupDiv.innerHTML = `<div class="word-group-label">${g.group}</div>`;
    const row = document.createElement("div");
    row.className = "word-chip-row";
    g.words.forEach(w => {
      const selected = sample.notes.some(n => n.stage === stage && n.text === w);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "word-chip" + (selected ? " selected" : "");
      btn.textContent = w;
      btn.onclick = () => {
        const idx = sample.notes.findIndex(n => n.stage === stage && n.text === w);
        if (idx === -1) sample.notes.push({ stage, text: w }); else sample.notes.splice(idx, 1);
        save();
        replaceCard(id, step);
      };
      row.appendChild(btn);
    });
    groupDiv.appendChild(row);
    section.appendChild(groupDiv);
  });

  // 自由入力
  const inputRow = document.createElement("div");
  inputRow.className = "note-input-row";
  inputRow.innerHTML = `
    <input type="text" placeholder="語彙にない気づきがあれば入力">
    <button class="note-add-btn">追加</button>`;
  const textInput = inputRow.querySelector("input");
  inputRow.querySelector("button").onclick = () => {
    if (!textInput.value.trim()) return;
    sample.notes.push({ stage, text: textInput.value.trim() });
    save();
    replaceCard(id, step);
  };
  section.appendChild(inputRow);

  // このサンプルのメモ一覧（全温度帯ぶん。タグで帯がわかる）
  const list = document.createElement("ul");
  list.className = "note-list";
  sample.notes.forEach((n, idx) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="tag">${escapeHtml(n.stage)}</span>${escapeHtml(n.text)}<span class="del">削除</span>`;
    li.querySelector(".del").onclick = () => {
      sample.notes.splice(idx, 1);
      save();
      replaceCard(id, step);
    };
    list.appendChild(li);
  });
  section.appendChild(list);

  return section;
}

/* まとめステップ：総合メモ・比較・答え合わせ・書き出し */
function renderWrap(step) {
  const c = document.getElementById("content");
  c.innerHTML = "";
  c.appendChild(stepHeader(step));

  // 総合メモ（サンプルごと）
  state.sampleOrder.forEach(id => {
    ensureSample(id);
    const sample = state.samples[id];
    const card = document.createElement("div");
    card.className = "sample-card";
    card.id = "card-" + id;
    card.innerHTML = `
      <div class="sample-card-head">
        <span class="sid">サンプル ${escapeHtml(id)}</span>
        <span class="score">${cvaScore(sample.scores)}</span>
      </div>
      <div class="sample-card-body">
        <textarea class="free-note" placeholder="全体の印象、次回への気づきなど">${escapeHtml(sample.freeNote)}</textarea>
      </div>`;
    card.querySelector("textarea").oninput = e => { sample.freeNote = e.target.value; save(); };
    c.appendChild(card);
  });

  // 比較表
  const comparePanel = document.createElement("div");
  comparePanel.className = "panel";
  comparePanel.innerHTML = `
    <div class="eyebrow">Comparison</div>
    <h2>サンプル比較</h2>
    <table class="compare">
      <thead><tr><th>Sample</th><th>Score</th><th>Defect</th></tr></thead>
      <tbody></tbody>
    </table>`;
  const tbody = comparePanel.querySelector("tbody");
  state.sampleOrder.forEach(id => {
    const s = state.samples[id];
    const tr = document.createElement("tr");
    const defectLabels = s.defects.map(k => DEFECTS.find(d => d.key === k).label).join("、") || "なし";
    tr.innerHTML = `<td>${escapeHtml(id)}</td><td class="score">${cvaScore(s.scores)}</td><td>${defectLabels}</td>`;
    tbody.appendChild(tr);
  });
  c.appendChild(comparePanel);

  // 答え合わせ
  const revealPanel = document.createElement("div");
  revealPanel.className = "panel";
  revealPanel.innerHTML = `
    <div class="eyebrow">Batch Match</div>
    <h2>答え合わせ（ブラインド解除後に入力）</h2>
    <p class="hint">DT%・煎り止めBTはここでは入力せず、バッチ名から焙煎ログ側の記録と後で突き合わせます</p>
    <div class="reveal-head"><span></span><span>バッチ名</span></div>
    <div id="revealRows"></div>`;
  const revealRows = revealPanel.querySelector("#revealRows");
  state.sampleOrder.forEach(id => {
    if (!state.reveal[id]) state.reveal[id] = { batch: "" };
    const r = state.reveal[id];
    const row = document.createElement("div");
    row.className = "reveal-row";
    row.innerHTML = `<span>${escapeHtml(id)}</span><input type="text" placeholder="例：03">`;
    const input = row.querySelector("input");
    input.value = r.batch;
    input.oninput = e => { r.batch = e.target.value; save(); renderExportArea(); };
    revealRows.appendChild(row);
  });
  c.appendChild(revealPanel);

  // 書き出し
  const exportPanel = document.createElement("div");
  exportPanel.className = "panel";
  exportPanel.innerHTML = `
    <div class="eyebrow">Export</div>
    <h2>Markdownで書き出し</h2>
    <textarea class="export-area" id="exportArea" readonly></textarea>
    <p class="export-hint" id="obsidianTargetHint"></p>
    <div class="btn-row">
      <button class="btn primary" id="saveObsidianBtn">Obsidianに保存</button>
      <button class="btn" id="copyBtn">コピー</button>
      <button class="btn" id="refreshExportBtn">最新の内容で更新</button>
    </div>
    <p class="export-hint">セッションが終わってから1回だけ押してください（続けて押すと内容が重複して追記されます）</p>`;
  c.appendChild(exportPanel);
  renderExportArea();

  exportPanel.querySelector("#refreshExportBtn").onclick = renderExportArea;
  exportPanel.querySelector("#saveObsidianBtn").onclick = () => {
    renderExportArea();
    window.location.href = buildObsidianUri();
  };
  exportPanel.querySelector("#copyBtn").onclick = () => {
    const area = document.getElementById("exportArea");
    area.select();
    navigator.clipboard.writeText(area.value).then(() => {
      const btn = exportPanel.querySelector("#copyBtn");
      const original = btn.textContent;
      btn.textContent = "コピーしました";
      setTimeout(() => btn.textContent = original, 1200);
    });
  };

  // 全リセット
  const resetRow = document.createElement("div");
  resetRow.className = "btn-row";
  resetRow.innerHTML = `<button class="btn warn">全データをリセット（新しいセッションを始める）</button>`;
  resetRow.querySelector("button").onclick = () => {
    if (!confirm("すべてのデータを消して、新しいセッションを始めますか？この操作は取り消せません。")) return;
    state = defaultState();
    openCards = new Set(state.sampleOrder.length ? [state.sampleOrder[0]] : []);
    alertUntil = 0;
    releaseWakeLock();
    save();
    updateTimerButtons();
    renderAll();
    tick();
  };
  c.appendChild(resetRow);

  const footer = document.createElement("footer");
  footer.textContent = "データはこのブラウザ内(localStorage)だけに保存されます。他の端末とは共有されません。";
  c.appendChild(footer);
}

function renderExportArea() {
  const area = document.getElementById("exportArea");
  if (!area) return;
  area.value = buildExportText(state);
  document.getElementById("obsidianTargetHint").textContent =
    `保存先: ${obsidianFilepath(state)}（ノートがなければ自動作成）`;
}

// Obsidian側に「Advanced URI」プラグイン導入済みが前提。obsidian://adv-uri 経由で追記する
const OBSIDIAN_VAULT = "Obsidian Master Vault";

function buildObsidianUri() {
  const parts = [
    `vault=${encodeURIComponent(OBSIDIAN_VAULT)}`,
    `filepath=${encodeURIComponent(obsidianFilepath(state))}`,
    `data=${encodeURIComponent(buildExportText(state))}`,
    `mode=append`,
  ];
  return `obsidian://adv-uri?${parts.join("&")}`;
}

/* ---- 下部ナビ ---- */

function updateBottomNav() {
  const i = state.currentStep;
  const prev = document.getElementById("prevStep");
  const next = document.getElementById("nextStep");
  prev.disabled = i === 0;
  next.disabled = i === STEPS.length - 1;
  prev.textContent = i > 0 ? `◀ ${STEPS[i - 1].name}` : "◀";
  next.textContent = i < STEPS.length - 1 ? `${STEPS[i + 1].name} ▶` : "▶";
}

document.getElementById("prevStep").onclick = () => {
  if (state.currentStep > 0) setStep(state.currentStep - 1);
};
document.getElementById("nextStep").onclick = () => {
  if (state.currentStep < STEPS.length - 1) setStep(state.currentStep + 1);
};

/* ---- 起動 ---- */

function renderAll() {
  renderStepNav();
  renderSampleBar();
  renderContent();
  updateBottomNav();
}

renderAll();
updateTimerButtons();
tick();
setInterval(tick, 300);
if (state.timer.running) acquireWakeLock(); // リロード後もタイマー継続中なら画面点灯を維持
</script>
</body>
